services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: contract_test
      MYSQL_USER: contract_user
      MYSQL_PASSWORD: contract-only-password
      MYSQL_ROOT_PASSWORD: contract-only-root-password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 45

  member:
    image: ${CONTRACT_MEMBER_IMAGE:-stylefinder-contract-member:test}
    ports:
      - "127.0.0.1::8080"
    environment:
      MEMBER_DB_URL: jdbc:mysql://mysql:3306/contract_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: contract_user
      MYSQL_PASSWORD: contract-only-password
      JWT_PRIVATE_KEY_PATH: /run/contract-keys/private.pem
      JWT_PUBLIC_KEY_PATH: /run/contract-keys/public.pem
      JWT_ISSUER: contract-member-service
      JWT_AUDIENCE: contract-search-api
      GOOGLE_OAUTH_ENABLED: "false"
      REFRESH_COOKIE_SECURE: "false"
    volumes:
      - type: bind
        source: ${CONTRACT_KEYS_DIR:?ephemeral test keys are required}
        target: /run/contract-keys
        read_only: true
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
